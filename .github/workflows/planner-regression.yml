name: Student Planner Regression

on:
  push:
    branches:
      - feature/planner-usability-improvements
  pull_request:
    branches:
      - develop
      - codex/backend-persistence
    paths:
      - "backend/**"
      - "frontend/**"
      - "requirements-integrated.txt"
      - "nutn_csie_115_graduation_rules.json"
      - ".github/workflows/planner-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-integrated.txt
      - run: python -m pip install -r requirements-integrated.txt
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check formatting
        run: npm run format:check || (npm run format && git diff && exit 1)
