name: Week 10 Study Agent Data Package

on:
  pull_request:
    branches:
      - codex/backend-persistence
  workflow_dispatch:

jobs:
  week10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-integrated.txt

      - name: Run focused backend tests
        run: python -m pytest backend/tests/test_study_agent_service.py backend/tests/test_study_agent_openai.py -q

      - name: Generate Week 10 offline data package
        run: python -m week10.run_acceptance

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Show Prettier diff
        working-directory: frontend
        run: |
          npm run format
          git diff -- src/components/StudyPlanner.jsx

      - name: Upload Week 10 evidence
        uses: actions/upload-artifact@v4
        with:
          name: week10-agent-data-package
          path: week10/evidence/offline_data_package.json
          if-no-files-found: error
